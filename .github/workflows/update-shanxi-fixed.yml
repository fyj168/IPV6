name: Update Shanxi Multicast (Fixed)

on:
  schedule:
    - cron: '0 */12 * * *'  # 每12小时
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install requests==2.31.0
        echo "✅ 依赖安装完成"
        
    - name: Create update script
      run: |
        cat > update.py << 'EOF'
#!/usr/bin/env python3
"""
山西组播源更新脚本 - 简化稳定版
"""

import requests
import re
from datetime import datetime
import sys

def main():
    print("🚀 开始更新山西组播源...")
    
    url = "https://my9.ltd/tvsh/"
    headers = {
        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
    }
    
    try:
        print(f"1. 访问网站: {url}")
        response = requests.get(url, headers=headers, timeout=15)
        response.encoding = 'utf-8'
        
        print(f"   状态码: {response.status_code}")
        
        if response.status_code != 200:
            print(f"❌ 网站访问失败")
            return False
        
        print(f"   页面大小: {len(response.text)} 字符")
        
        # 提取链接
        print("2. 提取M3U链接...")
        
        # 使用更简单的正则表达式
        m3u_pattern = r'href="([^"]+\.m3u[^"]*)"'
        txt_pattern = r'href="([^"]+\.txt[^"]*)"'
        
        m3u_links = re.findall(m3u_pattern, response.text, re.IGNORECASE)
        txt_links = re.findall(txt_pattern, response.text, re.IGNORECASE)
        
        all_links = m3u_links + txt_links
        print(f"   找到 {len(all_links)} 个链接")
        
        if not all_links:
            print("⚠️  未找到任何链接，尝试备用方案...")
            # 保存原始页面供分析
            with open('debug_page.html', 'w', encoding='utf-8') as f:
                f.write(response.text[:2000])
            print("   已保存页面片段到 debug_page.html")
            return False
        
        # 过滤山西相关链接
        print("3. 过滤山西相关链接...")
        shanxi_keywords = ['sx', 'shanxi', '山西', '太原', '大同']
        shanxi_links = []
        
        for link in all_links:
            link_lower = link.lower()
            if any(keyword in link_lower for keyword in shanxi_keywords):
                shanxi_links.append(link)
        
        print(f"   过滤出 {len(shanxi_links)} 个山西相关链接")
        
        # 如果没有山西链接，使用前几个链接
        if not shanxi_links:
            print("⚠️  未找到山西链接，使用前3个链接")
            shanxi_links = all_links[:3]
        
        # 生成M3U内容
        print("4. 生成M3U文件...")
        timestamp = datetime.now().strftime('%Y-%m-%d %H:%M:%S')
        
        content = [
            '#EXTM3U',
            '# 山西组播源',
            f'# 更新时间: {timestamp}',
            f'# 来源: {url}',
            f'# 链接数量: {len(shanxi_links)}',
            ''
        ]
        
        # 处理每个链接
        for i, link in enumerate(shanxi_links[:5]):  # 最多处理5个
            try:
                # 构建完整URL
                if link.startswith('http'):
                    full_url = link
                elif link.startswith('/'):
                    full_url = f"https://my9.ltd{link}"
                else:
                    full_url = f"https://my9.ltd/tvsh/{link}"
                
                print(f"   [{i+1}] 下载: {full_url}")
                
                r = requests.get(full_url, headers=headers, timeout=10)
                if r.status_code == 200:
                    # 添加来源注释
                    content.append(f'# 来源: {link}')
                    
                    # 处理内容
                    for line in r.text.split('\n'):
                        line = line.strip()
                        if line and not line.startswith('#EXTM3U'):
                            content.append(line)
                    
                    content.append('')  # 空行分隔
                    print(f"     成功，添加 {r.text.count('#EXTINF:')} 个频道")
                else:
                    print(f"     失败，状态码: {r.status_code}")
                    
            except Exception as e:
                print(f"     错误: {e}")
        
        # 保存文件
        print("5. 保存文件...")
        output = '\n'.join(content)
        
        with open('shanxi-multicast.m3u', 'w', encoding='utf-8') as f:
            f.write(output)
        
        # 统计信息
        channel_count = output.count('#EXTINF:')
        print(f"✅ 更新完成!")
        print(f"   文件: shanxi-multicast.m3u")
        print(f"   大小: {len(output)} 字符")
        print(f"   频道: {channel_count} 个")
        
        return True
        
    except Exception as e:
        print(f"❌ 运行出错: {e}")
        import traceback
        traceback.print_exc()
        return False

if __name__ == "__main__":
    success = main()
    sys.exit(0 if success else 1)
EOF
        
        echo "📝 脚本创建完成"
        
    - name: Run update script
      run: |
        python update.py
        
    - name: Check result
      run: |
        if [ -f "shanxi-multicast.m3u" ]; then
          echo "✅ 文件创建成功"
          echo "=== 文件信息 ==="
          ls -lh shanxi-multicast.m3u
          echo -e "\n=== 前10行 ==="
          head -10 shanxi-multicast.m3u
          echo -e "\n=== 频道数量 ==="
          grep -c "^#EXTINF:" shanxi-multicast.m3u || echo "0"
        else
          echo "❌ 文件创建失败"
          echo "=== 调试信息 ==="
          ls -la *.py debug_page.html 2>/dev/null || echo "无调试文件"
          exit 1
        fi
        
    - name: Commit changes
      if: success()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 检查是否有变化
        if git diff --quiet shanxi-multicast.m3u 2>/dev/null; then
          echo "📝 没有检测到文件变化"
        else
          echo "📤 提交更改..."
          git add shanxi-multicast.m3u
          git commit -m "更新山西组播源 $(date +'%Y-%m-%d %H:%M')"
          git push
          echo "✅ 更改已提交"
        fi
        
    - name: Upload debug artifacts
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: debug-files
        path: |
          debug_page.html
          update.py
