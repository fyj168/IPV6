name: Simple Shanxi M3U Update

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install requests
      run: pip install requests
    
    - name: Create and run script
      run: |
        # 创建非常简单的Python脚本
        cat > simple_update.py << "END"
import requests
import re
from datetime import datetime

url = "https://my9.ltd/tvsh/"
headers = {"User-Agent": "Mozilla/5.0"}

print("Starting update...")
try:
    r = requests.get(url, headers=headers, timeout=20)
    print(f"Status: {r.status_code}")
    
    if r.status_code == 200:
        # Find all .m3u links
        links = re.findall(r'href="([^"]+\.m3u[^"]*)"', r.text, re.I)
        print(f"Found {len(links)} M3U links")
        
        # Simple M3U content
        content = [
            "#EXTM3U",
            "# Shanxi Multicast Sources",
            f"# Updated: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}",
            ""
        ]
        
        count = 0
        for link in links[:3]:  # Process first 3 links
            if any(kw in link.lower() for kw in ['shanxi', '山西', 'sx']):
                try:
                    full_url = link if link.startswith('http') else url + link
                    print(f"Downloading: {full_url}")
                    r2 = requests.get(full_url, timeout=15)
                    if r2.status_code == 200:
                        content.append(f"# Source: {link}")
                        for line in r2.text.split('\\n'):
                            if line.strip():
                                content.append(line)
                        content.append("")
                        count += 1
                except Exception as e:
                    print(f"Error with {link}: {e}")
        
        # Save file
        with open('shanxi.m3u', 'w', encoding='utf-8') as f:
            f.write('\\n'.join(content))
        
        print(f"Done. Processed {count} links.")
    else:
        print("Failed to fetch page")
        exit(1)
        
except Exception as e:
    print(f"Error: {e}")
    exit(1)
END
        
        python simple_update.py
    
    - name: Check result
      run: |
        if [ -f "shanxi.m3u" ]; then
          mv shanxi.m3u shanxi-multicast.m3u
          echo "Success!"
          ls -lh shanxi-multicast.m3u
        else
          echo "Failed to create file"
          exit 1
        fi
    
    - name: Commit
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add shanxi-multicast.m3u
        git commit -m "Update Shanxi M3U $(date +'%Y-%m-%d')" || echo "No changes"
        git push || echo "Nothing to push"
