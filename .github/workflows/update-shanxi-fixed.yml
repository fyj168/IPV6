name: Update Shanxi Multicast Sources

on:
  schedule:
    # 每12小时运行一次
    - cron: '0 */12 * * *'
  workflow_dispatch:  # 允许手动触发
  push:
    branches:
      - main

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4
        
    - name: Download and update sources
      run: |
        python3 -c "
import requests
import re
from datetime import datetime

print('开始获取山西组播源...')
source_url = 'https://my9.ltd/tvsh/'

try:
    headers = {
        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
    }
    
    response = requests.get(source_url, headers=headers, timeout=30)
    response.encoding = 'utf-8'
    
    if response.status_code == 200:
        print('成功获取页面内容')
        
        m3u_links = re.findall(r'href=\"([^\"]+\.m3u[^\"]*)\"', response.text)
        txt_links = re.findall(r'href=\"([^\"]+\.txt[^\"]*)\"', response.text)
        all_links = m3u_links + txt_links
        
        if all_links:
            print(f'找到 {len(all_links)} 个链接')
            
            shanxi_links = []
            for link in all_links:
                if any(keyword in link.lower() for keyword in ['sx', 'shanxi', '山西', 'tvsh']):
                    shanxi_links.append(link)
            
            if not shanxi_links:
                print('未找到山西链接，使用前3个链接')
                shanxi_links = all_links[:3]
            
            content = []
            timestamp = datetime.now().strftime('%Y-%m-%d %H:%M:%S')
            content.append('#EXTM3U')
            content.append('# 山西组播源')
            content.append(f'# 更新时间: {timestamp}')
            content.append(f'# 来源: {source_url}')
            content.append('')
            
            for i, link in enumerate(shanxi_links[:3]):
                try:
                    if link.startswith('http'):
                        full_link = link
                    elif link.startswith('/'):
                        full_link = f'https://my9.ltd{link}'
                    else:
                        full_link = f'{source_url}{link}'
                    
                    print(f'下载: {full_link}')
                    r = requests.get(full_link, headers=headers, timeout=20)
                    
                    if r.status_code == 200:
                        for line in r.text.split('\\n'):
                            line = line.strip()
                            if line and not line.startswith('#EXTM3U'):
                                content.append(line)
                        content.append('')
                        print(f'成功处理链接 {i+1}')
                    else:
                        print(f'失败: {r.status_code}')
                        
                except Exception as e:
                    print(f'错误: {e}')
            
            with open('shanxi-multicast.m3u', 'w', encoding='utf-8') as f:
                f.write('\\n'.join(content))
            
            print('更新完成')
        else:
            print('未找到链接')
    else:
        print(f'HTTP错误: {response.status_code}')
        
except Exception as e:
    print(f'执行错误: {e}')
    exit(1)
"
        
    - name: Check result
      run: |
        if [ -f "shanxi-multicast.m3u" ]; then
          echo "文件已创建"
          echo "=== 预览 ==="
          head -15 shanxi-multicast.m3u
          echo "=== 统计 ==="
          echo "行数: $(wc -l < shanxi-multicast.m3u)"
        else
          echo "文件未创建"
          exit 1
        fi
        
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        if git diff --quiet shanxi-multicast.m3u 2>/dev/null; then
          echo "没有变化"
        else
          git add shanxi-multicast.m3u
          git commit -m "更新山西组播源 $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin main
        fi
