name: Docker Pull Example
on: [push]

jobs:
  docker-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Create output directory
        run: mkdir -p ./output
      
      - name: Pull Docker image
        run: docker pull kakaxi088/zubo:v3.2.0
      
      - name: Run Docker container
        run: |
          docker run \
            --name zubo-container \
            -v $(pwd)/output:/output \
            kakaxi088/zubo:v3.2.0 \
            sh -c "echo '容器执行完成' > /output/result.txt && echo '生成时间: $(date)' >> /output/result.txt"
      
      - name: Check generated file
        run: |
          echo "生成的文件内容："
          cat ./output/result.txt
          ls -la ./output/
