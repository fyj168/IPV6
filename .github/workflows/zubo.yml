name: Docker Pull Example
on: [push]

jobs:
  docker-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Pull Docker image
        run: docker pull kakaxi088/zubo:v3.2.0
      
      - name: Run Docker container
        run: |
          docker run \
            --name zubo-container \
            kakaxi088/zubo:v3.2.0
      
      - name: Generate report file
        run: |
          # 基于容器执行结果生成报告
          echo "Docker 容器执行报告" > report.txt
          echo "====================" >> report.txt
          echo "容器名称: zubo-container" >> report.txt
          echo "镜像版本: kakaxi088/zubo:v3.2.0" >> report.txt
          echo "执行时间: $(date)" >> report.txt
          echo "运行状态: $(docker inspect -f '{{.State.Status}}' zubo-container)" >> report.txt
          echo "退出代码: $(docker inspect -f '{{.State.ExitCode}}' zubo-container)" >> report.txt
          
          # 如果有容器日志，可以添加
          echo "最后日志:" >> report.txt
          docker logs --tail 10 zubo-container >> report.txt 2>&1 || true
      
      - name: Clean up container
        run: |
          docker rm zubo-container || true
      
      - name: Upload generated file
        uses: actions/upload-artifact@v4
        with:
          name: execution-report
          path: |
            report.txt
