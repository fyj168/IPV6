name: Shanxi M3U Update

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      
      - name: Install requests
        run: pip install requests
      
      - name: Create Python file
        run: |
          echo 'import requests' > update.py
          echo 'print("开始")' >> update.py
          echo 'url = "https://my9.ltd/tvsh/"' >> update.py
          echo 'r = requests.get(url, timeout=10)' >> update.py
          echo 'print(f"状态: {r.status_code}")' >> update.py
          echo 'with open("shanxi.m3u", "w") as f:' >> update.py
          echo '    f.write("#EXTM3U\\n# 山西")' >> update.py
      
      - name: Run script
        run: python update.py
      
      - name: Rename file
        run: mv shanxi.m3u shanxi-multicast.m3u
      
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
