name: Update Shanxi M3U Sources

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"
    
    - name: Install dependencies
      run: pip install requests
    
    - name: Create and run update script
      run: |
        # 创建Python脚本
        cat > update_script.py << "EOF"
import requests
import re
from datetime import datetime

url = "https://my9.ltd/tvsh/"
print("开始更新山西组播源...")

try:
    headers = {"User-Agent": "Mozilla/5.0"}
    response = requests.get(url, headers=headers, timeout=20)
    
    if response.status_code == 200:
        print("成功访问网站")
        
        # 查找链接
        pattern = r'href="([^"]+\.m3u[^"]*)"'
        links = re.findall(pattern, response.text, re.IGNORECASE)
        
        print(f"找到 {len(links)} 个M3U链接")
        
        # 过滤山西链接
        shanxi_links = []
        for link in links:
            if any(keyword in link.lower() for keyword in ['shanxi', '山西', 'sx']):
                shanxi_links.append(link)
        
        if not shanxi_links and links:
            print("未找到山西链接，使用前2个链接")
            shanxi_links = links[:2]
        
        # 生成内容
        content = ["#EXTM3U", f"# 更新时间: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}", "# 山西组播源", ""]
        
        # 处理链接
        for i, link in enumerate(shanxi_links):
            try:
                if link.startswith('http'):
                    full_url = link
                elif link.startswith('/'):
                    full_url = f"https://my9.ltd{link}"
                else:
                    full_url = f"{url}{link}"
                
                print(f"处理链接 {i+1}: {full_url}")
                r2 = requests.get(full_url, timeout=15)
                
                if r2.status_code == 200:
                    for line in r2.text.split('\\n'):
                        if line.strip():
                            content.append(line)
                    content.append("")
            except:
                continue
        
        # 保存文件
        with open('shanxi-multicast.m3u', 'w', encoding='utf-8') as f:
            f.write('\\n'.join(content))
        
        print("更新完成")
    else:
        print(f"访问失败: {response.status_code}")
        
except Exception as e:
    print(f"错误: {e}")
EOF
        
        python update_script.py
    
    - name: Check result
      run: |
        if [ -f "shanxi-multicast.m3u" ]; then
          echo "文件创建成功"
          ls -lh shanxi-multicast.m3u
        else
          echo "文件创建失败"
          exit 1
        fi
    
    - name: Commit changes
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add shanxi-multicast.m3u
        git diff --cached --quiet || git commit -m "更新山西组播源 $(date +'%Y-%m-%d')"
        git push || echo "没有变化"
