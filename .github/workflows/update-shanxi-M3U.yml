except Exception as e:
    print(f'执行错误: {e}')
    exit(1)
"
        
    - name: Check result
      run: |
        if [ -f "shanxi-multicast.m3u" ]; then
          echo "文件已创建"
          echo "=== 预览 ==="
          head -15 shanxi-multicast.m3u
          echo "=== 统计 ==="
          echo "行数: $(wc -l < shanxi-multicast.m3u)"
        else
          echo "文件未创建"
          exit 1
        fi
        
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        if git diff --quiet shanxi-multicast.m3u 2>/dev/null; then
          echo "没有变化"
        else
          git add shanxi-multicast.m3u
          git commit -m "更新山西组播源 $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin main
        fi
