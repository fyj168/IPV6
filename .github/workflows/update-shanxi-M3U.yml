name: Update Shanxi M3U

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"
    
    - name: Install dependencies
      run: pip install requests
    
    - name: Create update script
      run: |
        # 写入Python脚本文件
        echo 'import requests' > update.py
        echo 'import re' >> update.py
        echo 'from datetime import datetime' >> update.py
        echo '' >> update.py
        echo 'def main():' >> update.py
        echo '    print("开始获取山西组播源...")' >> update.py
        echo '    url = "https://my9.ltd/tvsh/"' >> update.py
        echo '    ' >> update.py
        echo '    try:' >> update.py
        echo '        headers = {"User-Agent": "Mozilla/5.0"}' >> update.py
        echo '        response = requests.get(url, headers=headers, timeout=20)' >> update.py
        echo '        ' >> update.py
        echo '        if response.status_code == 200:' >> update.py
        echo '            print("成功访问网站")' >> update.py
        echo '            ' >> update.py
        echo '            # 查找M3U链接' >> update.py
        echo '            pattern = r'\''href="([^"]+\.m3u[^"]*)"'\''' >> update.py
        echo '            links = re.findall(pattern, response.text, re.IGNORECASE)' >> update.py
        echo '            print(f"找到 {len(links)} 个M3U链接")' >> update.py
        echo '            ' >> update.py
        echo '            # 过滤山西链接' >> update.py
        echo '            shanxi_links = []' >> update.py
        echo '            for link in links:' >> update.py
        echo '                if any(keyword in link.lower() for keyword in ["shanxi", "山西", "sx"]):' >> update.py
        echo '                    shanxi_links.append(link)' >> update.py
        echo '            ' >> update.py
        echo '            if not shanxi_links and links:' >> update.py
        echo '                print("未找到山西链接，使用前3个链接")' >> update.py
        echo '                shanxi_links = links[:3]' >> update.py
        echo '            ' >> update.py
        echo '            # 生成M3U内容' >> update.py
        echo '            content = ["#EXTM3U", f"# 更新时间: {datetime.now().strftime('\''%Y-%m-%d %H:%M:%S'\'')}", "# 山西组播源", ""]' >> update.py
        echo '            ' >> update.py
        echo '            # 处理链接' >> update.py
        echo '            for i, link in enumerate(shanxi_links[:3]):' >> update.py
        echo '                try:' >> update.py
        echo '                    if link.startswith('\''http'\''):' >> update.py
        echo '                        full_url = link' >> update.py
        echo '                    elif link.startswith('\''/'\''):' >> update.py
        echo '                        full_url = f"https://my9.ltd{link}"' >> update.py
        echo '                    else:' >> update.py
        echo '                        full_url = f"{url}{link}"' >> update.py
        echo '                    ' >> update.py
        echo '                    print(f"处理链接 {i+1}: {full_url}")' >> update.py
        echo '                    r2 = requests.get(full_url, timeout=15)' >> update.py
        echo '                    ' >> update.py
        echo '                    if r2.status_code == 200:' >> update.py
        echo '                        for line in r2.text.split('\''\\n'\''):' >> update.py
        echo '                            if line.strip():' >> update.py
        echo '                                content.append(line)' >> update.py
        echo '                        content.append("")' >> update.py
        echo '                except:' >> update.py
        echo '                    continue' >> update.py
        echo '            ' >> update.py
        echo '            # 保存文件' >> update.py
        echo '            with open('\''shanxi-multicast.m3u'\'', '\''w'\'', encoding='\''utf-8'\'') as f:' >> update.py
        echo '                f.write('\''\\n'\''.join(content))' >> update.py
        echo '            ' >> update.py
        echo '            print("更新完成")' >> update.py
        echo '            return True' >> update.py
        echo '        else:' >> update.py
        echo '            print(f"访问失败: {response.status_code}")' >> update.py
        echo '            return False' >> update.py
        echo '            ' >> update.py
        echo '    except Exception as e:' >> update.py
        echo '        print(f"错误: {e}")' >> update.py
        echo '        return False' >> update.py
        echo '' >> update.py
        echo 'if __name__ == "__main__":' >> update.py
        echo '    import sys' >> update.py
        echo '    sys.exit(0 if main() else 1)' >> update.py
    
    - name: Run update script
      run: python update.py
    
    - name: Check result
      run: |
        if [ -f "shanxi-multicast.m3u" ]; then
          echo "✅ 文件创建成功"
          echo "=== 文件信息 ==="
          ls -lh shanxi-multicast.m3u
          echo -e "\n=== 前5行 ==="
          head -5 shanxi-multicast.m3u
        else
          echo "❌ 文件创建失败"
          exit 1
        fi
    
    - name: Commit changes
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add shanxi-multicast.m3u
        git diff --cached --quiet || git commit -m "更新山西组播源 $(date +'%Y-%m-%d')"
        git push || echo "没有变化"        git config user.email "actions@github.com"
        git add shanxi-multicast.m3u
        git diff --cached --quiet || git commit -m "更新山西组播源 $(date +'%Y-%m-%d')"
        git push || echo "没有变化"
