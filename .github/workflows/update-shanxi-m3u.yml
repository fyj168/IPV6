name: Update Shanxi Multicast Sources

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Setup Python and install requests
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Create and run Python script
      run: |
        cat > update.py << 'EOF'
import requests
import re
from datetime import datetime

print("开始获取山西组播源...")
url = "https://my9.ltd/tvsh/"

try:
    headers = {'User-Agent': 'Mozilla/5.0'}
    r = requests.get(url, headers=headers, timeout=30)
    r.encoding = 'utf-8'
    
    if r.status_code == 200:
        print("成功获取页面")
        
        # 提取链接
        links = re.findall(r'href="([^"]+\.(?:m3u|txt)[^"]*)"', r.text)
        print(f"找到 {len(links)} 个链接")
        
        shanxi_links = [link for link in links if any(kw in link.lower() for kw in ['sx', 'shanxi', '山西'])]
        
        if not shanxi_links:
            shanxi_links = links[:3]
            
        print(f"将处理 {len(shanxi_links)} 个链接")
        
        content = ['#EXTM3U', f'# 山西组播源', f'# 更新时间: {datetime.now().strftime("%Y-%m-%d %H:%M:%S")}', '']
        
        for link in shanxi_links[:3]:
            try:
                if link.startswith('/'):
                    full_link = f"https://my9.ltd{link}"
                elif not link.startswith('http'):
                    full_link = f"https://my9.ltd/tvsh/{link}"
                else:
                    full_link = link
                    
                print(f"下载: {full_link}")
                r2 = requests.get(full_link, timeout=20)
                if r2.status_code == 200:
                    for line in r2.text.split('\n'):
                        if line.strip() and not line.strip().startswith('#EXTM3U'):
                            content.append(line)
                    content.append('')
            except:
                continue
        
        with open('shanxi-multicast.m3u', 'w', encoding='utf-8') as f:
            f.write('\n'.join(content))
        
        print("更新完成")
    else:
        print(f"HTTP错误: {r.status_code}")
        
except Exception as e:
    print(f"错误: {e}")

EOF
        
        python update.py
        
    - name: Check result
      run: |
        if [ -f "shanxi-multicast.m3u" ]; then
          echo "✅ 文件创建成功"
          echo "前5行内容:"
          head -5 shanxi-multicast.m3u
        else
          echo "❌ 文件创建失败"
          exit 1
        fi
