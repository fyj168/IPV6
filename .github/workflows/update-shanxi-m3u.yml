name: Update Shanxi Multicast

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: pip install requests
    
    - name: Update sources
      run: python update_shanxi.py
    
    - name: Check result
      run: |
        if [ -f "shanxi-multicast.m3u" ]; then
          echo "✅ 更新成功"
          ls -la shanxi-multicast.m3u
        else
          echo "❌ 更新失败"
          exit 1
        fi
    
    - name: Commit changes
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add shanxi-multicast.m3u
        git diff --cached --quiet || git commit -m "更新山西组播源 $(date +'%Y-%m-%d %H:%M')"
        git push
